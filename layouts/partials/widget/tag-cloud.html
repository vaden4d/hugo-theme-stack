{{- $context := .Context -}}
{{- $limit := default 10 .Params.limit -}}
<section class="widget tagCloud">
    <!-- <div class="widget-icon">
        {{ partial "helper/icon" "tag" }}
    </div> -->
    <h2 class="widget-title section-title">{{ T "widget.tagCloud.title" }}</h2>

    <div class="tagCloud-tags">
        {{ range first $limit $context.Site.Taxonomies.tags.ByCount }}
            {{- $c := partial "helper/taxonomy-term-colors" (dict "term" .Page "taxonomy" "tags") -}}
            <a href="{{ .Page.RelPermalink }}" class="taxonomy-chip taxonomy-chip--tag widget-taxonomy-chip" style="--taxonomy-chip-bg: {{ $c.background }}; --taxonomy-chip-fg: {{ $c.color }}; background-color: var(--taxonomy-chip-bg); color: var(--taxonomy-chip-fg);">
                {{ .Page.Title }}
            </a>
        {{ end }}
    </div>
</section>
